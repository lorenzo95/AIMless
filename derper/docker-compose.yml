# Reference self-hosted DERP relay for AIMless's tailcat transport.
#
# Tailscale DERP relay + STUN with automatic Let's Encrypt TLS. derper
# terminates TLS itself and answers the ACME HTTP-01 challenge on port 80,
# so do NOT put an HTTP reverse proxy or load balancer in front of it.
#
# Prereqs:
#   - DNS A (and AAAA if you have IPv6) record: your relay hostname -> this VPS
#   - Firewall allows inbound 80/tcp, 443/tcp and 3478/udp
#
# Run:
#   cp .env.example .env      # then set DERP_DOMAIN to your hostname
#   docker compose up -d
#   docker compose logs -f derper
#
# Or without an .env file:
#   DERP_DOMAIN=derp.example.com docker compose up -d
#
# Then point AIMless at it (Relay ... -> self-hosted hostname, or the `relay`
# block in the daemon's config.json). See README.md in this directory.

services:
  derper:
    # Community build of tailscale.com/cmd/derper (Tailscale publishes no
    # official image). Pinned to a Tailscale release tag; bump occasionally.
    image: fredliang/derper:v1.104.5
    container_name: derper
    restart: unless-stopped
    environment:
      DERP_DOMAIN: ${DERP_DOMAIN:-derp.example.com}
      DERP_CERT_MODE: letsencrypt
      DERP_CERT_DIR: /app/certs
      DERP_ADDR: ":443"
      DERP_HTTP_PORT: "80"
      DERP_STUN: "true"
      DERP_STUN_PORT: "3478"
      # "false" = anyone who knows the hostname can relay through this server
      # (traffic is still end-to-end encrypted). Set "true" only if you also
      # run tailscaled on this VPS and mount its socket - see README.md.
      DERP_VERIFY_CLIENTS: "false"
    ports:
      - "80:80"          # ACME HTTP-01 challenge + HTTP -> HTTPS redirect
      - "443:443"        # DERP over TLS
      - "3478:3478/udp"  # STUN
    volumes:
      - ./certs:/app/certs       # Let's Encrypt certs, persisted across restarts
      - ./state:/var/lib/derper  # server node key, persisted across recreates
