[project]
name = "aimless-client"
version = "0.9.15"
description = "aimless - serverless instant messaging over the Yggdrasil overlay network"
requires-python = ">=3.10"
dependencies = ["pynacl>=1.5"]

[project.scripts]
aimless = "aimless.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aimless"]

[project.optional-dependencies]
# The tray/taskbar icon is drawn with cairo. Without it the app still runs,
# but the taskbar falls back to a generic icon - so it is worth declaring.
gui = ["pycairo>=1.20"]
dev = ["pytest>=8"]
